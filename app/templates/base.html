<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=20260612-mobile-result-card">
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/">
          <img class="brand-mark" src="/assets/icon.png" alt="" width="28" height="28">
          <span class="brand-text">Compress<span>Imgs</span></span>
        </a>
        <nav class="site-nav">
          <button
            type="button"
            class="nav-link"
            data-toast-key="privacy"
          >
            <img src="/assets/icon_nav_shield.png" alt="" width="16" height="16">
            <span>安全隐私</span>
          </button>
          <button
            type="button"
            class="nav-link"
            data-toast-key="help"
          >
            <img src="/assets/icon_nav_help.png" alt="" width="16" height="16">
            <span>使用帮助</span>
          </button>
          <a href="https://github.com/gouxinjie/compress-imgs" target="_blank" rel="noopener noreferrer" class="launch-button">
            <img src="/assets/icon_launch_lightning.png" alt="" width="14" height="14">
            <span>开源项目</span>
          </a>
        </nav>
      </header>
      <div class="nav-toast" id="nav-toast" role="status" aria-live="polite" hidden>
        <strong class="nav-toast-title" id="nav-toast-title"></strong>
        <p class="nav-toast-message" id="nav-toast-message"></p>
      </div>
      {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', path='js/common.js') }}?v=20260612-mobile-result-card" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
